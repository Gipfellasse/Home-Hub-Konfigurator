const ORDER_ENDPOINT = null;

async function submitOrder(order) {
  if (ORDER_ENDPOINT) {
    const res = await fetch(ORDER_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(order)
    });
    return { ok: res.ok };
  }
  return { ok: true };
}

const COMPARE_ROWS = [
  { label: "Nutzer", key: "usersLabel" },
  { label: "KI-Modellgröße", key: "aiSize" },
  { label: "Antwortgeschwindigkeit", key: "speed" },
  { label: "Speicher-Optionen", key: "storageText" },
  { label: "Home Kid-Modus", key: "kid" },
  { label: "Zubehör-Kompatibilität", key: "accText" },
  { label: "Preis", key: "priceText" }
];

const FAQ = [
  { q: "Brauche ich Internet für den Home Hub?", a: "Nur zum Einrichten und für Updates. Danach läuft alles komplett offline — der KI-Workspace, Home Kid und das Smart Home. Ohne Internet funktioniert dein Hub einfach weiter." },
  { q: "Wo genau liegen meine Daten?", a: "Auf der verschlüsselten Festplatte im Gerät, bei dir zu Hause. Es gibt keine Cloud, keine Server von uns, keine Konten bei Dritten. Bei RAID 1 (2 TB) werden alle Daten zusätzlich gespiegelt." },
  { q: "Was bedeutet „RAID 1 — gespiegelt“?", a: "Im Gerät arbeiten zwei Festplatten als Zwillinge: Jede Datei existiert immer zweimal. Fällt eine Platte aus, übernimmt sofort die andere — deine Dokumente und Projekte sind nicht weg." },
  { q: "Was ist der Home Kid-Modus?", a: "Ein extra sicherer Bereich nur für Kinder: Hausaufgaben-Hilfe, Lernpläne, Lernkarten und eine Offline-Wissensbibliothek — kindgerecht erklärt, ohne Werbung, ohne Chats mit Fremden. Eltern behalten die Übersicht." },
  { q: "Kann mein Kind damit ins Internet?", a: "Nein. Home Kid arbeitet komplett offline mit der im Gerät gespeicherten Wissensbibliothek. Es gibt keinen Browser, keine sozialen Medien und keine Kontaktaufnahme durch Fremde." },
  { q: "Was kann der KI-Workspace?", a: "Texte schreiben und überarbeiten, zusammenfassen, übersetzen, Lernkarten erstellen, Pläne und Listen organisieren, E-Mails entwerfen — alles läuft direkt auf dem Gerät, nichts wird versendet." },
  { q: "Was passiert, wenn das Gerät defekt ist?", a: "Du bekommst ein repariertes Austauschgerät und ziehst deine verschlüsselte Festplatte einfach um — deine Daten und Workspaces wandern mit. Mit erweitertem Support gilt die Garantie 48 Monate." },
  { q: "Kann ich später Speicher oder Zubehör aufrüsten?", a: "Ja. Tastatur-Sets und das Smart-Home-Funkmodul kannst du jederzeit nachkaufen. Den Speicher tauschst du über unseren Rüst-Service aus, ohne deine Daten zu verlieren." },
  { q: "Funktioniert der Hub mit meinen Smart-Home-Geräten?", a: "Mit dem Funkmodul (Zigbee & Matter) steuert der Hub die meisten gängigen Geräte: Lampen, Thermostate, Rollos, Steckdosen und Sensoren von über 100 Marken." },
  { q: "Fällt monatlich etwas an? Gibt es ein Abo?", a: "Nein. Du zahlst einmal für das Gerät — danach keine Kosten, kein Abo, keine versteckten Gebühren. Auch die Updates sind kostenlos." }
];

const HOW = [
  { n: "1", title: "Auspacken & anschließen", text: "Stecker in die Wand, Gerät einschalten. Mehr braucht es nicht — kein Handwerker, kein Kabelsalat." },
  { n: "2", title: "QR-Code scannen", text: "Mit dem Handy den QR-Code auf dem Gerät scannen. In 2 Minuten sind alle Workspaces und Home Kid-Profile eingerichtet." },
  { n: "3", title: "Fertig — los geht’s", text: "Öffne deinen Workspace und leg los: schreiben, planen, lernen. Für Kinder startet Home Kid mit einem Tipp auf das Kinder-Symbol." }
];

const PRIVACY_POINTS = [
  "Keine Cloud, keine Server, keine Konten bei Dritten",
  "Alle Workspaces getrennt & verschlüsselt pro Person",
  "Home Kid: ohne Internet, ohne Werbung, ohne Fremdkontakte",
  "Updates werden lokal geprüft und signiert installiert",
  "Verkauf oder Entsorgung? Ein Knopf löscht alles unwiderruflich",
  "Offen dokumentiert: Unser Sicherheits-Audit ist öffentlich einsehbar"
];

const euro = n => n.toLocaleString("de-DE") + " €";

function App() {
  const [modelId, setModelId] = React.useState(null);
  const [storageId, setStorageId] = React.useState(null);
  const [profiles, setProfiles] = React.useState(1);
  const [kbdQty, setKbdQty] = React.useState(0);
  const [accOn, setAccOn] = React.useState({});
  const [form, setForm] = React.useState({ name: "", email: "", street: "", zip: "", city: "", pay: "invoice" });
  const [errors, setErrors] = React.useState({});
  const [sent, setSent] = React.useState(false);
  const [sending, setSending] = React.useState(false);

  const model = PRODUCTS.find(p => p.id === modelId) || null;
  const storage = model && storageId && model.storages.includes(storageId) ? STORAGES[storageId] : null;

  const lines = [];
  if (model) lines.push({ label: model.name + " (" + model.usersLabel + ")", add: model.price });
  if (storage) lines.push({ label: "Speicher: " + storage.label, add: storage.add });
  if (model && profiles > 1) lines.push({ label: profiles + " Nutzerprofile", add: 0 });
  if (kbdQty > 0) lines.push({ label: kbdQty + "× Funk-Tastatur & Maus Set", add: kbdQty * ACCESSORIES.kbd.price });
  model && model.accessories.filter(a => a !== "kbd" && accOn[a]).forEach(a =>
    lines.push({ label: ACCESSORIES[a].name, add: ACCESSORIES[a].price })
  );
  const total = lines.reduce((s, l) => s + l.add, 0);
  const configComplete = !!model && !!storage;

  function pickModel(id) {
    const m = PRODUCTS.find(p => p.id === id);
    setModelId(id);
    setProfiles(p => Math.min(p, m.maxUsers));
    setKbdQty(q => Math.min(q, 3));
    setAccOn(o => {
      const next = {};
      m.accessories.filter(a => a !== "kbd").forEach(a => { if (o[a]) next[a] = true; });
      return next;
    });
    if (!m.storages.includes(storageId)) setStorageId(null);
  }

  function validate() {
    const e = {};
    if (!form.name.trim()) e.name = "Bitte gib deinen Namen an.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(form.email.trim())) e.email = "Bitte gib eine gültige E-Mail-Adresse an.";
    if (!form.street.trim()) e.street = "Bitte gib deine Straße und Hausnummer an.";
    if (!/^\d{4,5}$/.test(form.zip.trim())) e.zip = "Bitte gib eine gültige PLZ an.";
    if (!form.city.trim()) e.city = "Bitte gib deinen Wohnort an.";
    return e;
  }

  async function placeOrder(ev) {
    ev.preventDefault();
    const e = validate();
    setErrors(e);
    if (Object.keys(e).length || !configComplete) return;
    setSending(true);
    const result = await submitOrder({
      product: model.name, storage: storage.label, profiles,
      keyboardSets: kbdQty,
      accessories: model.accessories.filter(a => a !== "kbd" && accOn[a]).map(a => ACCESSORIES[a].name),
      total, customer: form
    });
    setSending(false);
    if (result.ok) setSent(true);
  }

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const field = (k, label, type, auto) => (
    <div className={"frow" + (errors[k] ? " invalid" : "")}>
      <label htmlFor={"f-" + k}>{label}</label>
      <input id={"f-" + k} type={type} autoComplete={auto} value={form[k]}
        onChange={e => set(k, e.target.value)} aria-invalid={!!errors[k]} aria-describedby={errors[k] ? "e-" + k : null} />
      <p className="err" id={"e-" + k}>{errors[k]}</p>
    </div>
  );

  return (
    <React.Fragment>
      <nav className="topbar" aria-label="Hauptnavigation">
        <a className="logo" href="#top"><span className="dot" aria-hidden="true"></span>Home Hub</a>
        <div className="navlinks">
          <a href="#konfigurator">Konfigurator</a>
          <a href="#vergleich">Vergleich</a>
          <a href="#datenschutz">Datenschutz</a>
          <a href="#faq">FAQ</a>
        </div>
      </nav>

      <header className="hero" id="top">
        <div className="wrap">
          <div>
            <h1>Dein KI-Workspace. <span>Deine Daten.</span><br/>Dein Zuhause.</h1>
            <p className="sub">Home Hub ist der lokale KI-Workspace für zu Hause: schreiben, planen, lernen — und mit <b>Home Kid</b> ein sicherer Lernbereich für Kinder. Alles auf dem Gerät, ohne Cloud.</p>
            <div className="badges">
              <span className="badge">🔒 100 % lokal</span>
              <span className="badge">☁️ Keine Cloud</span>
              <span className="badge">💳 Kein Abo</span>
              <span className="badge">🧒 Home Kid-Modus</span>
            </div>
            <div className="cta-row">
              <a className="btn btn-primary" href="#konfigurator">Jetzt konfigurieren</a>
              <a className="btn btn-ghost" href="#so-funktioniert">So funktioniert’s</a>
            </div>
          </div>
          <div className="hero-art" aria-hidden="true">
            <div className="device">
              <div className="led"></div>
              <div className="face"><div className="dots"><i></i><i></i><i></i></div></div>
            </div>
          </div>
        </div>
      </header>

      <section className="section" id="konfigurator">
        <div className="wrap">
          <h2>Konfigurier deinen Home Hub</h2>
          <p className="lead">Fünf Schritte, kein Kleingedrucktes: Wähle Gerät, Speicher, Profile und Zubehör — der Preis rechnet sich live mit.</p>

          <div className="config-layout">
            <div>
              <div className="stepnav" aria-label="Konfigurator-Schritte">
                {[["1", "Modell", !!model], ["2", "Speicher", !!storage], ["3", "Profile", !!model], ["4", "Zubehör", !!model], ["5", "Bestellen", sent]].map(([n, t, done]) => (
                  <button key={n} className={done ? "done" : ""} onClick={() => document.getElementById("step-" + n).scrollIntoView({ behavior: "smooth" })}>
                    {done ? "✓" : n} {t}
                  </button>
                ))}
              </div>

              <div className="step" id="step-1">
                <h3><span className="stepnum" aria-hidden="true">1</span>Welches Modell passt zu euch?</h3>
                <p className="hint">Alle drei Modelle speichern und rechnen komplett lokal — sie unterscheiden sich in Leistung, Nutzerzahl und Ausstattung.</p>
                <div className="cards" role="radiogroup" aria-label="Modell wählen">
                  {PRODUCTS.map(p => (
                    <button key={p.id} className="card" role="radio" aria-checked={modelId === p.id} onClick={() => pickModel(p.id)}>
                      <h4>{p.name}</h4>
                      <p className="for">{p.usersLabel}</p>
                      <ul>{p.highlights.map((h, i) => <li key={i}>{h}</li>)}</ul>
                      <p className="price">ab {euro(p.price)} <small>inkl. MwSt.</small></p>
                    </button>
                  ))}
                </div>
              </div>

              <div className="step" id="step-2">
                <h3><span className="stepnum" aria-hidden="true">2</span>Wie viel Speicher brauchst du?</h3>
                <p className="hint">{model ? "Verfügbar für " + model.name + ". Alle Angaben sind großzügige Richtwerte." : "Wähle zuerst ein Modell in Schritt 1."}</p>
                {model ? (
                  <div className="optgrid" role="radiogroup" aria-label="Speicher wählen">
                    {model.storages.map(sid => (
                      <button key={sid} className="opt" role="radio" aria-checked={storageId === sid} onClick={() => setStorageId(sid)}>
                        <b>{STORAGES[sid].label}</b>
                        <span className="add">{STORAGES[sid].add === 0 ? "inklusive" : "+ " + euro(STORAGES[sid].add)}</span>
                        <p className="info">{STORAGES[sid].info}</p>
                      </button>
                    ))}
                  </div>
                ) : <p className="empty" style={{ color: "var(--muted)" }}>Bitte zuerst ein Modell wählen.</p>}
              </div>

              <div className="step" id="step-3">
                <h3><span className="stepnum" aria-hidden="true">3</span>Für wie viele Personen?</h3>
                <p className="hint">Jede Person bekommt ihr eigenes, verschlüsseltes Profil: eigene Termine, eigene Erinnerungen, eigene Daten — niemand sieht etwas vom anderen.</p>
                {model ? (
                  <div className="stepper">
                    <button onClick={() => setProfiles(p => Math.max(1, p - 1))} disabled={profiles <= 1} aria-label="Weniger Profile">−</button>
                    <div className="val" aria-live="polite">{profiles}<small>von max. {model.maxUsers}</small></div>
                    <button onClick={() => setProfiles(p => Math.min(model.maxUsers, p + 1))} disabled={profiles >= model.maxUsers} aria-label="Mehr Profile">+</button>
                  </div>
                ) : <p style={{ color: "var(--muted)" }}>Bitte zuerst ein Modell wählen.</p>}
              </div>

              <div className="step" id="step-4">
                <h3><span className="stepnum" aria-hidden="true">4</span>Zubehör & Extras</h3>
                <p className="hint">Alles optional — dein Hub funktioniert auch ohne.</p>
                <div className="acc">
                  {model && model.accessories.includes("kbd") ? (
                    <div className="accrow">
                      <div className="info"><b>{ACCESSORIES.kbd.name}</b><p>{ACCESSORIES.kbd.desc}</p></div>
                      <div className="side">
                        <span className="price-tag">{euro(ACCESSORIES.kbd.price)} / Stk.</span>
                        <div className="stepper">
                          <button onClick={() => setKbdQty(q => Math.max(0, q - 1))} disabled={kbdQty <= 0} aria-label="Weniger Tastatur-Sets">−</button>
                          <div className="val" aria-live="polite">{kbdQty}<small>von max. 3</small></div>
                          <button onClick={() => setKbdQty(q => Math.min(3, q + 1))} disabled={kbdQty >= 3} aria-label="Mehr Tastatur-Sets">+</button>
                        </div>
                      </div>
                    </div>
                  ) : null}
                  {model && model.accessories.filter(a => a !== "kbd").map(a => (
                    <div className="accrow" key={a}>
                      <div className="info"><b>{ACCESSORIES[a].name}</b><p>{ACCESSORIES[a].desc}</p></div>
                      <div className="side">
                        <span className="price-tag">+ {euro(ACCESSORIES[a].price)}</span>
                        <div className="switch">
                          <input type="checkbox" id={"acc-" + a} checked={!!accOn[a]}
                            onChange={e => setAccOn(o => ({ ...o, [a]: e.target.checked }))} />
                          <label className="track" htmlFor={"acc-" + a} aria-label={ACCESSORIES[a].name + " hinzufügen"}></label>
                        </div>
                      </div>
                    </div>
                  ))}
                  {!model && <p style={{ color: "var(--muted)" }}>Bitte zuerst ein Modell wählen.</p>}
                </div>
              </div>

              <div className="step" id="step-5">
                <h3><span className="stepnum" aria-hidden="true">5</span>Deine Zusammenfassung</h3>
                <p className="hint">Prüfe deine Auswahl — alles kannst du oben jederzeit ändern.</p>
                <div className="summary">
                  {lines.length ? (
                    <ul>
                      {lines.map((l, i) => (
                        <li key={i}><span>{l.label}</span><span>{l.add === 0 ? "inklusive" : euro(l.add)}</span></li>
                      ))}
                    </ul>
                  ) : <p className="empty">Noch nichts gewählt — starte mit Schritt 1.</p>}
                  <div className="total"><span>Gesamtpreis</span><b>{euro(total)}</b></div>
                  <a className="btn btn-primary" href="#bestellung" disabled={!configComplete}
                    aria-disabled={!configComplete}
                    style={configComplete ? null : { pointerEvents: "none", opacity: .45 }}>
                    {configComplete ? "Jetzt vorbestellen" : "Erst Modell & Speicher wählen"}
                  </a>
                  {!configComplete && <p className="note" style={{ color: "var(--muted)", fontSize: ".85rem", marginTop: 10, textAlign: "center" }}>Vorbestellen ist möglich, sobald Modell und Speicher gewählt sind.</p>}
                </div>

                <div id="bestellung" style={{ scrollMarginTop: 90 }}>
                  {sent ? (
                    <div className="success" role="status">
                      <div className="big" aria-hidden="true">🎉</div>
                      <h3>Danke, {form.name.split(" ")[0]}!</h3>
                      <p>Deine Vorbestellung für den <b>{model.name}</b> ({storage.label}, {profiles} {profiles === 1 ? "Profil" : "Profile"}) ist eingegangen.</p>
                      <p>Eine Bestätigungs-E-Mail geht an <b>{form.email}</b>. Wir melden uns, sobald dein Home Hub in Produktion ist — Bezahlung erst vor dem Versand.</p>
                    </div>
                  ) : (
                    <form className="order" onSubmit={placeOrder} noValidate>
                      <h3 style={{ color: "var(--navy)", marginBottom: 16 }}>Vorbestellung — unverbindlich</h3>
                      {field("name", "Name", "text", "name")}
                      {field("email", "E-Mail", "email", "email")}
                      {field("street", "Straße & Hausnummer", "text", "street-address")}
                      <div style={{ display: "grid", gridTemplateColumns: "130px 1fr", gap: 12 }}>
                        {field("zip", "PLZ", "text", "postal-code")}
                        {field("city", "Wohnort", "text", "address-level2")}
                      </div>
                      <fieldset>
                        <legend>Zahlungsart</legend>
                        <div className="payopts">
                          {[["invoice", "Rechnung"], ["sepa", "SEPA-Lastschrift"], ["card", "Kreditkarte"]].map(([v, t]) => (
                            <div className="payopt" key={v}>
                              <input type="radio" name="pay" id={"pay-" + v} value={v}
                                checked={form.pay === v} onChange={() => set("pay", v)} />
                              <label htmlFor={"pay-" + v}>{t}</label>
                            </div>
                          ))}
                        </div>
                      </fieldset>
                      <button className="btn btn-primary" type="submit" disabled={!configComplete || sending}>
                        {sending ? "Wird gesendet …" : "Vorbestellung absenden"}
                      </button>
                      <p className="fine">Unverbindlich & kostenlos — du kannst jederzeit stornieren. Es ist noch keine Zahlung fällig.</p>
                    </form>
                  )}
                </div>
              </div>
            </div>

            <aside className="price-card" aria-label="Preisübersicht">
              <h3>Deine Auswahl</h3>
              {lines.length ? (
                <ul>
                  {lines.map((l, i) => <li key={i}><span>{l.label}</span><span>{l.add === 0 ? "0 €" : euro(l.add)}</span></li>)}
                </ul>
              ) : <p className="none">Noch nichts gewählt.</p>}
              <div className="total"><small>Gesamt</small><b aria-live="polite">{euro(total)}</b></div>
              <a className="btn btn-primary" href="#bestellung" style={configComplete ? null : { pointerEvents: "none", opacity: .45 }}>Vorbestellen</a>
              <p className="note">🔒 Daten bleiben lokal · Kein Abo · 30 Tage Rückgabe</p>
            </aside>
          </div>
        </div>
      </section>

      <div className="bottombar" aria-label="Preisübersicht mobil">
        <div className="bb-total"><small>Gesamt</small><b aria-live="polite">{euro(total)}</b></div>
        <a className="btn btn-primary" href="#step-5">Zur Bestellung</a>
      </div>

      <section className="section alt" id="vergleich">
        <div className="wrap">
          <h2>Die Modelle im Vergleich</h2>
          <p className="lead">Alle drei speichern und rechnen lokal — der Unterschied liegt in Leistung, Nutzerzahl und Ausstattung.</p>
          <details className="compare">
            <summary>Vergleichstabelle anzeigen</summary>
            <div className="cmp-scroll">
              <table className="cmp">
                <thead>
                  <tr><th scope="col"></th>{PRODUCTS.map(p => <th scope="col" key={p.id}>{p.name}</th>)}</tr>
                </thead>
                <tbody>
                  {COMPARE_ROWS.map(r => (
                    <tr key={r.key}>
                      <td>{r.label}</td>
                      {PRODUCTS.map(p => {
                        const v = r.key === "storageText" ? p.storages.map(s => STORAGES[s].label.replace(" (RAID 1)", "")).join(", ")
                          : r.key === "accText" ? p.accessories.map(a => ACCESSORIES[a].name.split(" (")[0]).join(", ")
                          : r.key === "priceText" ? "ab " + euro(p.price)
                          : p[r.key];
                        return <td key={p.id}>{v}</td>;
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </details>
        </div>
      </section>

      <section className="section" id="so-funktioniert">
        <div className="wrap">
          <h2 className="center">In 5 Minuten einsatzbereit</h2>
          <p className="lead center">Kein Techniker, kein Handbuch, keine Konto-Erstellung. Auspacken, scannen, fertig.</p>
          <div className="how-grid">
            {HOW.map(h => (
              <div className="how" key={h.n}>
                <div className="n" aria-hidden="true">{h.n}</div>
                <h4>{h.title}</h4>
                <p>{h.text}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      <section className="section" id="datenschutz">
        <div className="wrap">
          <div className="privacy">
            <h2>Datenschutz, der wirklich einer ist</h2>
            <p className="claim">Deine Daten verlassen nie dein Zuhause.</p>
            <ul>
              {PRIVACY_POINTS.map((p, i) => <li key={i}>{p}</li>)}
            </ul>
          </div>
        </div>
      </section>

      <section className="section alt" id="faq">
        <div className="wrap">
          <h2 className="center">Häufige Fragen</h2>
          <div className="faq-list">
            {FAQ.map((f, i) => (
              <details className="faq-item" key={i}>
                <summary>{f.q}</summary>
                <div><p style={{ color: "var(--muted)" }}>{f.a}</p></div>
              </details>
            ))}
          </div>
        </div>
      </section>

      <footer>
        <div className="wrap">
          <div>
            <div className="flogo">🔒 Home Hub</div>
            <p style={{ fontSize: ".85rem", marginTop: 6 }}>Dein KI-Workspace. Deine Daten. Dein Zuhause.</p>
          </div>
          <nav aria-label="Rechtliches">
            <a href="#" title="Platzhalter">Impressum</a>
            <a href="#" title="Platzhalter">Datenschutzerklärung</a>
            <a href="#" title="Platzhalter">AGB</a>
            <a href="#" title="Platzhalter">Widerrufsbelehrung</a>
          </nav>
          <p style={{ fontSize: ".85rem" }}>© 2026 Home Hub</p>
        </div>
      </footer>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
